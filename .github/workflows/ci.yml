name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:

jobs:
  w1-gate:
    name: "W1 gate — sign → offline-verify round-trip + crypto test matrix"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
